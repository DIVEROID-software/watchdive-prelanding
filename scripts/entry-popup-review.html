<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WatchDive · 첫 방문 팝업 검토</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9edf2;color:#201748;font:14px system-ui,sans-serif}header{min-height:76px;background:#fff;border-bottom:1px solid #cbd3dd;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{font-size:18px;margin:0 0 4px}p{margin:0;font-size:12px;color:#65717e}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select{font:inherit;min-height:40px;border:1px solid #c4c9d3;background:#fff;color:#201748;padding:8px 12px;cursor:pointer}button[aria-pressed=true]{background:#201748;color:white}main{padding:20px;display:flex;justify-content:center}iframe{width:390px;height:min(844px,calc(100dvh - 120px));min-height:500px;max-width:100%;border:1px solid #b5bdc8;background:#201748;box-shadow:0 14px 40px #10212e1a}iframe.desktop{width:1440px}button:focus-visible,select:focus-visible{outline:3px solid #36a9e1;outline-offset:2px}@media(max-width:600px){header{padding:12px 16px}main{padding:12px}iframe{height:740px}.controls{gap:5px}}
</style></head><body>
<header><div><h1>WatchDive · 첫 방문 신청 팝업</h1><p>로컬 검토용 · 신청은 모의 동작이며 실제 메일은 발송되지 않습니다.</p></div><div class="controls"><button id="mobile" aria-pressed="true">모바일</button><button id="desktop" aria-pressed="false">PC</button><select id="language" aria-label="언어"><option value="ko">한국어</option><option value="en">English</option></select><select id="segment" aria-label="페이지"><option value="scuba">스쿠버</option><option value="freediving">프리다이빙</option></select><button id="again">팝업 다시 보기 ↻</button></div></header>
<main><iframe id="preview" title="WatchDive 랜딩 팝업 미리보기"></iframe></main>
<script>
const frame=document.getElementById('preview'),language=document.getElementById('language'),segment=document.getElementById('segment');
function reset(){for(const key of ['wd:entry-capture-dismissed:v1','wd:acquisition-device-state:v1','watchdive.signup-handles.v1'])localStorage.removeItem(key);sessionStorage.removeItem('wd:acquisition-capture:v1');try{frame.contentWindow.sessionStorage.removeItem('wd:acquisition-capture:v1')}catch{}frame.src=(language.value==='ko'?'/ko':'')+'/'+segment.value+'?qa=true&preview='+Date.now();}
for(const mode of ['mobile','desktop'])document.getElementById(mode).onclick=()=>{frame.className=mode==='desktop'?'desktop':'';document.getElementById('mobile').setAttribute('aria-pressed',String(mode==='mobile'));document.getElementById('desktop').setAttribute('aria-pressed',String(mode==='desktop'));reset()};
language.onchange=segment.onchange=reset;document.getElementById('again').onclick=reset;reset();
</script></body></html>
